name: ci

on:
  push:
    branches:
      - v1
      - master
  pull_request:
    branches:
      - v1
      - master

permissions:
  contents: read

env:
  # Retain Node 22.0 and odd releases excluded by the current Vitest engines.
  # These ranges are only for compatibility jobs; package.json tracks current tooling.
  VITEST_COMPAT_VERSION: '^3.2.7'
  VITE_COMPAT_VERSION: '^6.4.5'

# Cancel in progress workflows
# in the scenario where we already had a run going for that PR/branch/tag but then triggered a new run
concurrency:
  group: "${{ github.workflow }} ✨ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      - name: Build package
        run: npm run build

      - name: Run lint
        run: npm run lint

  size:
    name: Check package size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      - name: Check package size
        run: npm run size

  performance:
    name: Run performance test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Run performance test
        shell: bash
        run: |
          set -o pipefail
          npm run test:performance 2>&1 | tee perf.txt

      - name: Performance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Performance (${{ matrix.os }} · $(node -v))"
            echo ''
            echo '```'
            node -e "process.stdout.write(require('fs').readFileSync('perf.txt','utf8').replace(/\x1b\[[0-9;]*[A-Za-z]/g,''))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run tests
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        node-version: ["22.0.0", 22, 23, 24, 25, 26]
        exclude:
          # Skip: setup-node ships a broken bundled npm for the exact 22.0.0 build on Windows
          # ("Cannot find module 'C:\npm\prefix\node_modules\npm\bin\npm-cli.js'")
          - os: windows-2022
            node-version: "22.0.0"
          # Skip: node-gyp build of the "iconv" devDependency fails on Windows with Node 26,
          # which is built with thin-LTO and leaks clang/lld flags (-flto=thin, opt:lldltojobs)
          # into the MSVC link step (LNK1117). Upstream node-gyp/Node toolchain issue.
          - os: windows-2022
            node-version: 26

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure npm loglevel
        run: |
          npm config set loglevel error
        shell: bash

      - name: Select compatible Vitest for Node ${{ matrix.node-version }}
        if: matrix.node-version == '22.0.0' || matrix.node-version == 22 || matrix.node-version == 23 || matrix.node-version == 25
        shell: bash
        run: |
          npm pkg delete 'devDependencies.@vitest/browser-playwright'
          npm pkg set "devDependencies.vitest=$VITEST_COMPAT_VERSION" "devDependencies.@vitest/coverage-v8=$VITEST_COMPAT_VERSION" "devDependencies.@vitest/browser=$VITEST_COMPAT_VERSION" "devDependencies.vite=$VITE_COMPAT_VERSION"

      - name: Install dependencies
        run: npm install

      - name: Output Node and NPM versions
        run: |
          echo "Node.js version: $(node -v)"
          echo "NPM version: $(npm -v)"

      - name: Run tests
        shell: bash
        run: npm run test:ci

      - name: Check types
        run: npm run typecheck

      # Node 22.0 lacks native TypeScript support; its library tests still run above.
      - name: Check single-byte WPT conformance
        if: matrix.node-version != '22.0.0'
        run: node test/wpt/run.ts single-byte-decoder --strict

      - name: WPT encoding conformance report
        if: matrix.node-version != '22.0.0'
        shell: bash
        continue-on-error: true
        run: node test/wpt/report.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}-${{ matrix.os }}
          path: ./coverage/lcov.info
          retention-days: 1

      # Resolve LCOV source paths on their original OS; Coveralls combines the jobs.
      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage/lcov.info
          format: lcov
          flag-name: node-${{ matrix.node-version }}-${{ matrix.os }}
          parallel: true

  coverage:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Finish parallel coverage reports
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  test_browser:
    name: Run browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser
